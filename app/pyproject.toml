[project]
name = "policy-agent-app"
version = "0.1.0"
description = "Databricks App (FastAPI + React) for the policy compliance framework"
requires-python = ">=3.11"
authors = [{ name = "Greg Hansen", email = "gregory.hansen@databricks.com" }]

# The app reuses the library for all domain logic; only web-serving deps are added here.
dependencies = [
    "databricks-policy-agent[lakebase]",
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "pydantic>=2.7.0,<3.0",
    "databricks-sdk>=0.83.0,<1.0",
]

[build-system]
requires = ["hatchling>=1.9.0,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_agent_app"]

[tool.uv.sources]
databricks-policy-agent = { path = "..", editable = true }

[dependency-groups]
dev = [
    "pytest~=8.3.3",
    "httpx~=0.27.0",
    "ruff~=0.3.4",
    "mypy~=1.9.0",
]

[tool.uv]
required-version = "~=0.11.0"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's ``Depends(...)`` in argument defaults is the intended idiom.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["policy_agent_app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["policy_agent_app"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
