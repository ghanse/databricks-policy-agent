# Databricks App policies.
policy: apps-naming-convention
description: App names must be lowercase, hyphen-separated identifiers.
resource_type: app
effect: allow
enforcement_level: advisory
rule:
  all:
    - { attribute: name, operator: matches_regex, value: "^[a-z][a-z0-9-]+$" }
remediation: Rename the app to a lowercase, hyphen-separated identifier.
---
# Model serving endpoint policies.
policy: endpoints-owned-by-service-principals
description: Model serving endpoints must be owned by a service principal, not an individual.
resource_type: serving_endpoint
effect: deny
enforcement_level: hard
rule:
  any:
    - { attribute: owner_type, operator: equals, value: user }
remediation: Recreate the endpoint under a service principal owner.
---
policy: endpoints-require-budget-policy
description: Model serving endpoints must be attached to a budget policy for cost attribution.
resource_type: serving_endpoint
effect: allow
enforcement_level: soft
rule:
  all:
    - { attribute: budget_policy_id, operator: exists }
remediation: Attach a budget policy to the serving endpoint.
