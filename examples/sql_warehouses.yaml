# SQL warehouse policies.
policy: warehouses-must-auto-stop
description: SQL warehouses must auto-stop within 60 minutes of inactivity.
resource_type: sql_warehouse
effect: allow
enforcement: soft
rule:
  all:
    - { attribute: auto_stop_minutes, operator: ttl_within, value: 60 }
remediation: Set the warehouse auto-stop to 60 minutes or less.
---
policy: warehouses-should-be-serverless
description: SQL warehouses should use serverless compute.
resource_type: sql_warehouse
effect: allow
enforcement: advisory
rule:
  all:
    - { attribute: enable_serverless_compute, operator: equals, value: true }
remediation: Enable serverless compute on the warehouse.
