# Unity Catalog and related resource policies.
policy: catalogs-must-be-isolated
description: Catalogs must be bound to specific workspaces (ISOLATED isolation mode).
resource_type: catalog
effect: allow
enforcement_level: soft
rule:
  all:
    - { attribute: isolation_mode, operator: equals, value: ISOLATED }
remediation: Set the catalog's isolation mode to ISOLATED and bind it to its workspaces.
---
policy: schemas-must-be-documented
description: Every schema must carry a comment describing its contents.
resource_type: schema
effect: allow
enforcement_level: advisory
rule:
  all:
    - { attribute: comment, operator: exists }
remediation: Add a COMMENT to the schema.
---
policy: volumes-must-be-managed
description: Volumes must be managed rather than external.
resource_type: volume
effect: allow
enforcement_level: soft
rule:
  all:
    - { attribute: volume_type, operator: equals, value: MANAGED }
remediation: Recreate the volume as a managed volume.
---
policy: external-locations-should-not-be-read-only-by-default
description: External locations must explicitly declare a read-only setting.
resource_type: external_location
effect: allow
enforcement_level: advisory
rule:
  all:
    - { attribute: read_only, operator: exists }
remediation: Set the external location's read_only flag explicitly.
---
policy: secret-scopes-must-use-databricks-backend
description: Secret scopes must use the Databricks-managed backend.
resource_type: secret_scope
effect: allow
enforcement_level: soft
rule:
  all:
    - { attribute: backend_type, operator: equals, value: DATABRICKS }
remediation: Recreate the secret scope with the Databricks-managed backend.
---
policy: quality-monitors-must-be-scheduled
description: Quality monitors must run on a schedule, not only on demand.
resource_type: quality_monitor
effect: allow
enforcement_level: soft
rule:
  all:
    - { attribute: has_schedule, operator: equals, value: true }
remediation: Add a schedule to the quality monitor.
