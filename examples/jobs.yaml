# Job policies.
policy: jobs-naming-convention
description: Job names must be prefixed with an environment (prod_, stg_, or dev_).
resource_type: job
effect: allow
enforcement_level: advisory
rule:
  all:
    - { attribute: name, operator: matches_regex, value: "^(prod|stg|dev)_[a-z0-9_]+$" }
remediation: Rename the job to start with prod_, stg_, or dev_.
---
policy: production-jobs-need-failure-alerts
description: Production jobs must configure on-failure email notifications.
resource_type: job
effect: allow
enforcement_level: hard
match:
  all:
    - { attribute: name, operator: matches_regex, value: "^prod_.+$" }
rule:
  all:
    - { attribute: has_email_notifications, operator: equals, value: true }
remediation: Add an on-failure email notification to the job.
---
policy: jobs-must-be-tagged
description: Every job must carry at least one tag for cost attribution and ownership.
resource_type: job
effect: allow
enforcement_level: soft
rule:
  all:
    - { attribute: tags, operator: not_empty }
remediation: Add one or more tags to the job.
---
policy: jobs-must-have-retry-policy
description: Every job task must configure a retry policy so transient failures self-heal.
resource_type: job
effect: allow
enforcement_level: soft
rule:
  all:
    - { attribute: has_retry_policy, operator: equals, value: true }
remediation: Set max_retries to a nonzero value on every task (use -1 for unlimited retries).
---
policy: jobs-should-use-serverless-compute
description: Jobs should run on serverless compute rather than classic job clusters.
resource_type: job
effect: allow
enforcement_level: advisory
rule:
  all:
    - { attribute: uses_serverless_compute, operator: equals, value: true }
remediation: Remove new_cluster / existing_cluster_id / job_cluster_key from the job's tasks.
