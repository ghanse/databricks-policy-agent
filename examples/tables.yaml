# UC table policies.
policy: tables-must-be-documented
description: Every table must have a comment so its purpose is discoverable in the catalog.
resource_type: table
effect: allow
enforcement_level: advisory
rule:
  all:
    - { attribute: comment, operator: exists }
remediation: Add a comment describing the table.
---
policy: tables-must-be-delta
description: Managed tables must use Delta so they get ACID guarantees and time travel.
resource_type: table
effect: allow
enforcement_level: soft
match:
  all:
    - { attribute: table_type, operator: equals, value: MANAGED }
rule:
  all:
    - { attribute: data_source_format, operator: equals, value: DELTA }
remediation: Recreate the table in Delta format.
---
policy: production-tables-must-be-owned-by-a-service-principal
description: Production tables must be owned by a service principal, not an individual user.
resource_type: table
effect: allow
enforcement_level: hard
match:
  all:
    - { attribute: catalog_name, operator: equals, value: prod }
rule:
  all:
    - { attribute: owner_type, operator: equals, value: service_principal }
remediation: Transfer ownership of the table to the team's service principal.
---
policy: no-open-format-tables-in-prod
description: Production managed tables must use an open format (Delta or Iceberg), not Parquet.
resource_type: table
effect: allow
enforcement_level: soft
match:
  all:
    - { attribute: catalog_name, operator: equals, value: prod }
    - { attribute: table_type, operator: equals, value: MANAGED }
rule:
  all:
    - { attribute: data_source_format, operator: in, value: [DELTA, ICEBERG] }
remediation: Recreate the table in Delta or Iceberg format.
---
policy: prod-tables-must-enable-change-data-feed
description: Production Delta tables must enable change data feed for downstream CDC consumers.
resource_type: table
effect: allow
enforcement_level: advisory
match:
  all:
    - { attribute: catalog_name, operator: equals, value: prod }
    - { attribute: data_source_format, operator: equals, value: DELTA }
rule:
  all:
    - { attribute: properties.delta.enableChangeDataFeed, operator: equals, value: "true" }
remediation: Set the delta.enableChangeDataFeed table property to true.
