# Secret scope policies.
policy: secret-scopes-must-use-databricks-backend
description: Secret scopes must use the Databricks-managed backend.
resource_type: secret_scope
effect: allow
enforcement_level: soft
rule:
  all:
    - { attribute: backend_type, operator: equals, value: DATABRICKS }
remediation: Recreate the secret scope with the Databricks-managed backend.
