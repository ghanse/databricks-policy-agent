[project]
name = "policy-agent-mcp"
version = "0.1.0"
description = "Custom MCP server (Databricks App) exposing the policy compliance framework"
requires-python = ">=3.11"
authors = [{ name = "Greg Hansen", email = "gregory.hansen@databricks.com" }]

# The server reuses the library for all domain logic; only MCP-serving deps are added here.
dependencies = [
    "databricks-policy-agent[lakebase]",
    "mcp>=1.2.0,<2.0",
    "databricks-sdk>=0.83.0,<1.0",
]

[project.scripts]
policy-agent-mcp = "policy_agent_mcp.server:main"

[build-system]
requires = ["hatchling>=1.9.0,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_agent_mcp"]

[tool.uv.sources]
databricks-policy-agent = { path = "..", editable = true }

[dependency-groups]
dev = [
    "pytest~=8.3.3",
    "ruff~=0.3.4",
    "mypy~=1.9.0",
]

[tool.uv]
required-version = "~=0.11.0"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["policy_agent_mcp"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["policy_agent_mcp"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
